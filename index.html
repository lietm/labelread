<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcohol Label Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #3b82f6; /* Blue-500 */
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 sm:p-8">
    <main class="w-full max-w-2xl flex flex-col items-center">
        
        <h1 class="text-3xl md:text-4xl font-bold mb-8 text-center bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-blue-600">
            Alcohol Label Scanner
        </h1>

        <input type="file" id="uploadInput" accept="image/*" class="hidden">
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
        
        <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto justify-center">
            <button id="uploadBtn" class="bg-blue-600 hover:bg-blue-700 transition-colors duration-300 text-white font-bold py-4 px-8 rounded-full shadow-[0_0_20px_rgba(37,99,235,0.4)] hover:shadow-[0_0_30px_rgba(37,99,235,0.6)] flex items-center space-x-2 w-full sm:w-auto justify-center text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                <span>Upload Label</span>
            </button>
            <button id="cameraBtn" class="bg-blue-600 hover:bg-blue-700 transition-colors duration-300 text-white font-bold py-4 px-8 rounded-full shadow-[0_0_20px_rgba(37,99,235,0.4)] hover:shadow-[0_0_30px_rgba(37,99,235,0.6)] flex items-center space-x-2 w-full sm:w-auto justify-center text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span>Take Photo</span>
            </button>
        </div>

        <div id="errorContainer" class="mt-8 w-full max-w-md bg-yellow-900/30 border border-yellow-700/50 rounded-xl p-4 hidden text-yellow-400 text-center font-medium shadow-lg">
            Error: The API request failed. Please retry in a minute.
        </div>

        <div id="previewContainer" class="mt-8 hidden flex-col items-center">
            <img id="imagePreview" class="max-w-xs max-h-64 rounded-xl shadow-lg border border-gray-800 object-contain" alt="Label Preview">
        </div>

        <div id="loadingContainer" class="mt-8 hidden flex-col items-center space-y-4">
            <div class="loader"></div>
            <p class="text-blue-400 font-medium animate-pulse">Analyzing label content...</p>
        </div>

        <div id="resultsContainer" class="mt-8 w-full bg-gray-900 border border-gray-800 rounded-2xl p-6 hidden shadow-2xl">
            <h2 class="text-xl font-semibold mb-4 border-b border-gray-800 pb-2 text-blue-400">Extracted Information</h2>
            <div id="resultsContent" class="space-y-4 text-sm md:text-base break-words">
                <!-- Results will be injected here -->
            </div>
        </div>

    </main>

    <script>
        const uploadInput = document.getElementById('uploadInput');
        const cameraInput = document.getElementById('cameraInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const cameraBtn = document.getElementById('cameraBtn');
        const previewContainer = document.getElementById('previewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const loadingContainer = document.getElementById('loadingContainer');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsContent = document.getElementById('resultsContent');
        const errorContainer = document.getElementById('errorContainer');

        uploadBtn.addEventListener('click', () => uploadInput.click());
        cameraBtn.addEventListener('click', () => cameraInput.click());
        uploadInput.addEventListener('change', handleFileSelection);
        cameraInput.addEventListener('change', handleFileSelection);

        async function handleFileSelection(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Reset UI states for a new scan
            errorContainer.classList.add('hidden');
            resultsContainer.classList.add('hidden');
            previewContainer.classList.remove('hidden');
            loadingContainer.classList.remove('hidden');

            try {
                // Resize Image locally to save bandwidth and speed up processing
                const resizedBase64 = await resizeImage(file, 800);
                imagePreview.src = resizedBase64;

                // Send to Gemini
                const extractedData = await analyzeLabelWithGemini(resizedBase64);

                // Display Results
                displayResults(extractedData);
            } catch (error) {
                console.error("Error processing label:", error);
                // Trigger the specific error message UI
                errorContainer.classList.remove('hidden');
                resultsContainer.classList.add('hidden');
            } finally {
                loadingContainer.classList.add('hidden');
            }
            
            // Reset input so the same file can be selected again if needed
            event.target.value = '';
        }

        function resizeImage(file, maxDimension) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxDimension) {
                                height = Math.round((height * maxDimension) / width);
                                width = maxDimension;
                            }
                        } else {
                            if (height > maxDimension) {
                                width = Math.round((width * maxDimension) / height);
                                height = maxDimension;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Output as JPEG
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.onerror = () => reject(new Error("Failed to load image."));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error("Failed to read file."));
                reader.readAsDataURL(file);
            });
        }

        async function analyzeLabelWithGemini(base64DataUrl) {
            // The API key is injected natively by this environment when left empty
            const apiKey = ""; 
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            // Strip the data:image/jpeg;base64, prefix
            const base64String = base64DataUrl.split(',')[1];

            const prompt = "Extract the following text for each part from this alcohol label, case sensitive: Brand name, Class/type designation, Alcohol content, Net contents, Name and address of bottler/producer, Country of origin for imports, Government Health Warning Statement. Return strictly as JSON using those exact descriptions as keys. If a field is not found, output an empty string.";

            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [
                            { text: prompt },
                            {
                                inlineData: {
                                    mimeType: "image/jpeg",
                                    data: base64String
                                }
                            }
                        ]
                    }
                ],
                generationConfig: {
                    responseMimeType: "application/json",
                }
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            // If the fetch fails on the network level or returns a 4xx/5xx status, throw to trigger the error UI
            if (!response.ok) {
                throw new Error(`API Request failed with status ${response.status}`);
            }

            const data = await response.json();
            
            if (data.candidates && data.candidates.length > 0 && data.candidates[0].content) {
                const jsonString = data.candidates[0].content.parts[0].text;
                try {
                    return JSON.parse(jsonString);
                } catch (e) {
                    throw new Error("Failed to parse JSON response from Gemini.");
                }
            } else {
                throw new Error("No valid response received from the model.");
            }
        }

        function displayResults(data) {
            // Mapping the desired output labels to the keys we requested from Gemini
            const displayMapping = [
                { label: "Brand Name", key: "Brand name" },
                { label: "Class/Type", key: "Class/type designation" },
                { label: "Alcohol Content", key: "Alcohol content" },
                { label: "Net Contents", key: "Net contents" },
                { label: "Name and Address", key: "Name and address of bottler/producer", hideIfEmpty: true },
                { label: "Country of Origin", key: "Country of origin for imports", hideIfEmpty: true },
                { label: "Government Warning", key: "Government Health Warning Statement" }
            ];

            let htmlOutput = '';

            displayMapping.forEach(item => {
                let value = "Not Found";
                
                // Exact key match
                if (data[item.key] !== undefined && data[item.key] !== null && data[item.key] !== "") {
                     value = data[item.key];
                } else {
                    // Try case-insensitive fallback just in case
                    const foundKey = Object.keys(data).find(k => k.toLowerCase() === item.key.toLowerCase());
                    if (foundKey && data[foundKey]) {
                        value = data[foundKey];
                    }
                }

                // If hideIfEmpty is true and we didn't find anything, skip it to keep UI clean, 
                // but we'll show all explicitly requested fields based on your prompt.
                
                htmlOutput += `
                    <div class="mb-4">
                        <span class="block text-gray-400 font-semibold mb-1">${item.label}:</span> 
                        <span class="text-white font-mono bg-gray-800 px-2 py-1 rounded">"${value}"</span>
                    </div>
                `;
            });

            resultsContent.innerHTML = htmlOutput;
            resultsContainer.classList.remove('hidden');
        }
    </script>
</body>
</html>
