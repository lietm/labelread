<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcohol Label Scanner</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        .button-container {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }
        .btn {
            background-color: blue;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        .btn:hover {
            background-color: darkblue;
        }
        .note {
            color: #a0a0a0;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
            max-width: 400px;
        }
        #upload-input {
            display: none;
        }
        #camera-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        video {
            max-width: 100%;
            width: 400px;
            border: 2px solid #333;
            margin-bottom: 10px;
        }
        #capture-btn {
            background-color: #28a745;
        }
        #preview-image {
            display: none;
            max-width: 100%;
            width: 400px;
            border: 2px solid #333;
            border-radius: 5px;
            margin-top: 15px;
            margin-bottom: 15px;
        }
        #output-container {
            display: none;
            margin-top: 20px;
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 600px;
            line-height: 1.6;
        }
        #loading, #error-message {
            display: none;
            margin-top: 20px;
            font-size: 16px;
        }
        #error-message {
            color: #ff4d4d;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div class="button-container">
        <button class="btn" onclick="document.getElementById('upload-input').click()">Upload Label</button>
        <input type="file" id="upload-input" accept="image/*" onchange="handleUpload(event)">
        
        <button class="btn" onclick="startCamera()">Take Photo Label</button>
    </div>

    <div class="note">To take a photo, ensure camera is accessible through the browser, or use a mobile device</div>

    <div id="camera-container">
        <video id="video" autoplay playsinline></video>
        <button class="btn" id="capture-btn" onclick="takePhoto()">Capture</button>
    </div>

    <img id="preview-image" alt="Image Preview">

    <div id="loading">Processing image...</div>
    <div id="error-message">Error: The API request failed. Please retry in a minute.</div>
    
    <div id="output-container"></div>
    <canvas id="canvas"></canvas>

    <script>
        const endpoint = "https://sweet-thunder-fc54.mr-minhng.workers.dev";
        let videoStream = null;

        async function startCamera() {
            const cameraContainer = document.getElementById('camera-container');
            const video = document.getElementById('video');
            hideMessages();

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = videoStream;
                cameraContainer.style.display = "flex";
            } catch (err) {
                alert("Camera access denied or not available.");
            }
        }

        function takePhoto() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            
            // Set canvas to native video resolution
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Stop camera to save battery
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('camera-container').style.display = "none";

            // Show captured image preview
            const preview = document.getElementById('preview-image');
            preview.src = canvas.toDataURL('image/jpeg');
            preview.style.display = "block";

            processAndSendImage(canvas);
        }

        function handleUpload(event) {
            hideMessages();
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                // Show uploaded image preview
                const preview = document.getElementById('preview-image');
                preview.src = e.target.result;
                preview.style.display = "block";

                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    processAndSendImage(canvas);
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function processAndSendImage(sourceCanvas) {
            // Resize image to reduce payload size while maintaining text legibility
            const MAX_SIZE = 800;
            let width = sourceCanvas.width;
            let height = sourceCanvas.height;

            if (width > height && width > MAX_SIZE) {
                height *= MAX_SIZE / width;
                width = MAX_SIZE;
            } else if (height > MAX_SIZE) {
                width *= MAX_SIZE / height;
                height = MAX_SIZE;
            }

            const resizeCanvas = document.createElement('canvas');
            resizeCanvas.width = width;
            resizeCanvas.height = height;
            const ctx = resizeCanvas.getContext('2d');
            ctx.drawImage(sourceCanvas, 0, 0, width, height);

            // Convert to base64 jpeg
            const base64Image = resizeCanvas.toDataURL('image/jpeg', 0.7).split(',')[1];
            sendToWorker(base64Image);
        }

        async function sendToWorker(base64Data) {
            document.getElementById('loading').style.display = "block";
            
            const prompt = "Extract the following from the alcohol label: Brand name, Class/type designation, Alcohol content, Net contents, Name and address of bottler/producer, Country of origin for imports, and Government Health Warning Statement. Return strictly as JSON.";

            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                            ]
                        }],
                        generationConfig: {
                            responseMimeType: "application/json"
                        }
                    })
                });

                if (!response.ok) throw new Error("Network response was not ok");
                
                const data = await response.json();
                
                // Parse the JSON text returned by Gemini inside the Worker response
                let rawText = data.candidates[0].content.parts[0].text;
                let extractedJson = JSON.parse(rawText);
                
                displayResults(extractedJson);

            } catch (error) {
                console.error("Error calling worker:", error);
                document.getElementById('loading').style.display = "none";
                document.getElementById('error-message').style.display = "block";
            }
        }

        function displayResults(json) {
            document.getElementById('loading').style.display = "none";
            
            // Helper function to reliably match keys in the LLM's JSON output
            const getValue = (keywords) => {
                for (let key in json) {
                    const lowerKey = key.toLowerCase();
                    if (keywords.some(k => lowerKey.includes(k))) {
                        return json[key] || "Not found";
                    }
                }
                return "Not found";
            };

            const outputHtml = `
                <div>Brand Name: "${getValue(['brand'])}"</div>
                <div>Class/Type: "${getValue(['class', 'type'])}"</div>
                <div>Alcohol Content: "${getValue(['alcohol', 'abv', 'content'])}"</div>
                <div>Net Contents: "${getValue(['net', 'volume', 'ml'])}"</div>
                <div>Government Warning: "${getValue(['warning', 'government'])}"</div>
                <div style="color: #a0a0a0; font-size: 13px; text-align: center; font-style: italic;">
                    Note: The raw scan result is returned as a structured JSON object, making it easy to parse and integrate into other systems or databases.
                </div>
            `;

            const outputContainer = document.getElementById('output-container');
            outputContainer.innerHTML = outputHtml;
            outputContainer.style.display = "block";
        }

        function hideMessages() {
            document.getElementById('loading').style.display = "none";
            document.getElementById('error-message').style.display = "none";
            document.getElementById('output-container').style.display = "none";
            document.getElementById('camera-container').style.display = "none";
            
            const preview = document.getElementById('preview-image');
            if(preview) preview.style.display = "none"; 
        }
    </script>
</body>
</html>
